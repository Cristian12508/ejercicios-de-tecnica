<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cajero Bancario</title>
</head>
<body>

    <h2>Cajero Bancario Inteligente</h2>

    <h3>Saldo inicial: $300.00</h3>

    <label>Monto ($):</label>
    <input type="number" id="monto" min="0" step="0.01">
    <br><br>

    <label>Operación:</label>
    <select id="operacion">
        <option value="Depósito">Depósito</option>
        <option value="Retiro">Retiro</option>
    </select>
    <br><br>

    <button onclick="realizarOperacion()">Realizar operación</button>
    <button onclick="mostrarResumen()">Ver resumen</button>

    <h3>Movimientos</h3>
    <ul id="lista"></ul>

    <div id="resumen">Saldo actual: $300.00</div>

    <script>

        // Saldo inicial
        const saldoInicial = 300;

        // Vector de movimientos
        let movimientos = [];

        // Calcular depósitos, retiros y saldo
        function calcularTotales() {

            let depositado = 0;
            let retirado = 0;

            for (const mov of movimientos) {

                if (mov.tipo === "Depósito") {
                    depositado += mov.monto;
                } else {
                    retirado += mov.monto;
                }

            }

            return {
                depositado: depositado,
                retirado: retirado,
                saldo: saldoInicial + depositado - retirado
            };
        }

        // Realizar operación
        function realizarOperacion() {

            const monto = parseFloat(
                document.getElementById("monto").value
            );

            const tipo = document.getElementById("operacion").value;

            if (isNaN(monto) || monto <= 0) {
                alert("Ingrese un monto válido mayor a 0.");
                return;
            }

            if (tipo === "Retiro") {

                const saldoActual = calcularTotales().saldo;

                if (monto > saldoActual) {
                    alert("Saldo insuficiente.");
                    return;
                }
            }

            movimientos.push({
                tipo: tipo,
                monto: monto
            });

            document.getElementById("monto").value = "";

            mostrarMovimientos();

            document.getElementById("resumen").textContent =
                "Saldo actual: $" +
                calcularTotales().saldo.toFixed(2);
        }

        // Mostrar movimientos
        function mostrarMovimientos() {

            const lista = document.getElementById("lista");

            lista.innerHTML = "";

            for (let i = 0; i < movimientos.length; i++) {

                const li = document.createElement("li");

                li.textContent = movimientos[i].tipo +
                    ": $" + movimientos[i].monto.toFixed(2);

                lista.appendChild(li);
            }
        }

        // Mostrar resumen
        function mostrarResumen() {

            const t = calcularTotales();

            document.getElementById("resumen").textContent =
                "Saldo inicial: $300.00\n" +
                "Total depositado: $" + t.depositado.toFixed(2) + "\n" +
                "Total retirado: $" + t.retirado.toFixed(2) + "\n" +
                "Saldo final: $" + t.saldo.toFixed(2);
        }

    </script>

</body>
</html>
